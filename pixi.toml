[workspace]
name = "carrie"
version = "0.1.0"
description = "Building a mobile manipulator based on a Fetch Mobile Manipulator chassis"
authors = ["Griswald Brooks <griswald.brooks@gmail.com>"]
channels = ["conda-forge", "robostack-jazzy"]
platforms = ["linux-64", "osx-arm64"]

[tasks]
build = "colcon build --symlink-install"
clean = "rm -rf build install log"
test = "colcon test"
view-carrie = { cmd = "bash -c 'source install/setup.bash && ros2 launch carrie_description view_carrie.launch.py'", depends-on = ["build"] }
sim-headless = { cmd = "bash -c 'source install/setup.bash && ros2 launch carrie_gz carrie_gz.launch.py'", depends-on = ["build"] }
sim-gui = { cmd = "bash -c 'source install/setup.bash && gz sim -g'", depends-on = ["build"] }
sim-rsp = { cmd = "bash -c 'source install/setup.bash && ros2 launch carrie_gz carrie_gz.launch.py rsp:=True rviz:=True'", depends-on = ["build"] }
sim-headless-multi = { cmd = "bash -c 'source install/setup.bash && source pixi_params.sh && ros2 launch carrie_gz carrie_gz.launch.py ros_bridge:=False robots:=\"$ROBOTS\"'", depends-on = ["build"]}
sam3-detection-server = {cmd = "bash -c 'source install/setup.bash && ros2 run carrie_perception sam3_detection_server --ros-args --params-file carrie_perception/config/sam3_params.yaml'", depends-on = ["build"]}
sam3-client = {cmd = "bash -c 'source install/setup.bash && ros2 run carrie_perception test_client --ros-args --params-file carrie_perception/config/sam3_params.yaml'", depends-on = ["build"]}

[dependencies]
# ROS2 Jazzy core
ros-jazzy-ros-base = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-ament-cmake-python = "*"

# ROS2 Jazzy packages for carrie_description
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-xacro = "*"

# ROS2 Jazzy packages for carrie_gz
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-nav2-common = "*"
ros-jazzy-ros-gz-bridge = "*"
ros-jazzy-ros-gz-sim = "*"

# ROS2 Jazzy pacges for carrie_perception
ros-jazzy-cv-bridge = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-image-transport = "*"

# Build tools
cmake = ">=3.22"
colcon-common-extensions = "*"
ccache = "*"

# Development tools
clang = "*"
clang-format = "*"
clang-tools = "*"
git = "*"
git-lfs = "*"
neovim = "*"
pre-commit = "*"

# Python
python = ">=3.10"
pip = "*"
qt-main = "*"

# Transfromer repo for SAM3 architecture
[feature.ml.pypi-dependencies]
transformers = { git = "https://github.com/huggingface/transformers.git", branch = "main" }

# Python dependencies for SAM3
[pypi-dependencies]
torchvision = "*"
supervision = "*"

[feature.dev.dependencies]
# Additional development dependencies
gdb = "*"

[environments]
default = ["dev", "ml"]
